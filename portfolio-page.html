<!DOCTYPE html>

<html lang="en">

   <head>
      <meta charset="utf-8">
      <title> Portfolio Page </title>
      <link href="css/styles.css" type="text/css" rel="stylesheet">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>

   <body class="portfolio_page">

      <!-- Navigation bar for all pages -->
       <nav>
         <div>
            <a href="digital-cv-page.html"> Digital CV </a>
         </div>
         <ul>
            <!-- links to the other 3 pages -->
            <li> <a href="about-me-page.html"> About Me </a> </li>
            <li> <a href="cv-page.html"> CV</a> </li>
            <li> <a href="portfolio-page.html"> Portfolio </a> </li>
         </ul>
      </nav>

      <!-- Main section container -->
      <main class="portfolio">

         <!-- Main page title -->
         <h1 class="portfolio_title"> My Projects </h1>
         
         <!-- Responsive CSS Grid container displaying project cards -->
         <div class="portfolio_grid">

            <!-- Card 1 wrapper link -->
            <a href="project1.com" class="project_links">
            <article class="project">

               <!-- Project thumbnail image container -->
               <div class="project_image">
                  <img src="images/project1.jpg" alt="Project 1 image">
               </div>

               <!-- Project name and description info block -->
               <div class="project_info">
                  <h2>Project Name: [Project 1 Name] </h2>
                  <p>Some description of the first project</p>
               </div>
            </article>
             </a>

            <!-- Card 2 wrapper link -->
            <a href="project2.com" class="project_links">
             <article class="project">

               <!-- Project thumbnail image container -->
               <div class="project_image">
                  <img src="images/project2.jpg" alt="Project 2 image">
               </div>

               <!-- Project name and description info block -->
               <div class="project_info">
                  <h2>Project Name: [Project 2 Name] </h2>
                  <p>Some description of the second project</p>
               </div>
            </article>
            </a>

            <!-- Card 3 wrapper link -->
             <a href="project3.com" class="project_links">
             <article class="project">

               <!-- Project thumbnail image container -->
               <div class="project_image">
                  <img src="images/project3.jpg" alt="Project 3 image">
               </div>

               <!-- Project name and description info block -->
               <div class="project_info">
                  <h2>Project Name: [Project 3 Name] </h2>
                  <p>Some description of the third project</p>
               </div>
            </article>
            </a>
         </div>

         <!-- Call-to-action button wrapper to external projects in github -->
         <div class="button_more">
            <a href="https://github.com/" target="_blank" class="button">VIEW MORE PROJECTS</a>
         </div>

      </main>  
    
   </body>

</html>
